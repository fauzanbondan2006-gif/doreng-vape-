<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doreng Vape Store - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* RESET DASAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #2D4157; /* Warna Biru sesuai Slide 2 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            text-align: center;
        }

        /* LOGO */
        .logo-main {
            width: 80%;
            max-width: 250px;
            height: auto;
            margin-bottom: 20px;
        }

        .title-top {
            font-size: clamp(24px, 5vw, 45px);
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* WRAPPER TOMBOL */
        .nav-group {
            display: flex;
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            margin-bottom: 40px;
        }

        .btn {
            width: 170px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn-sejarah { background-color: #1A1A1A; color: #FFFFFF; }
        .btn-sosmed { background-color: #FFFFFF; color: #1A1A1A; }
        
        .btn:hover { transform: scale(1.05); }

        .feat-box {
            font-weight: bold;
            font-style: italic;
            font-size: 20px;
        }

        .title-bottom {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 20px;
        }

        /* KHUSUS HP (Dibawah 480px) */
        @media (max-width: 480px) {
            .nav-group {
                flex-direction: column; /* Tombol jadi atas-bawah */
                gap: 15px;
            }
            .btn {
                width: 220px; /* Lebarin tombol biar pas di jempol */
            }
        }
    </style>
</head>
<body>

    <img src="logo_vape.png" class="logo-main" alt="Logo">
    
    <h1 class="title-top">DORENG VAPE</h1>

    <div class="nav-group">
        <a href="slide3.html" class="btn btn-sejarah">SEJARAH</a>

        <div class="feat-box">FEAT</div>

        <a href="slide4.html" class="btn btn-sosmed">SOSMED</a>
    </div>

    <h2 class="title-bottom">SIDAREJA VAPE STORE</h2>

</body>
</html>
